name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every version the README's "Python 3.8+" admits, and all of them on one
        # pinned runner: each of 3.8 to 3.14 has stable linux-x64 builds for
        # 24.04 in actions/python-versions (3.8.18 is the newest 3.8 with one),
        # read off versions-manifest.json rather than assumed, so no leg needs an
        # older image. `tests/test_bts.py` pins this list to the README's floor -
        # raise the floor there and this matrix must shrink with it, and the other
        # way round.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: say which interpreter this is
        # A matrix leg that silently fell back to the runner's own python would
        # otherwise pass as coverage of a version it never ran.
        run: python3 -VV
      - name: the laws
        # The package is standard library only - there is nothing to install, and
        # `test_the_validator_imports_nothing_but_the_standard_library` is what
        # keeps that true.
        run: python3 -m unittest discover -s tests
      - name: every command the README tells a reader to run
        # The README is the interface most readers use, so each of its commands is
        # exercised here with the exit code it documents. `set -e` is the default
        # shell, so a non-zero exit from any line fails the step.
        run: |
          python3 -m bts hash schema/bounded-task.schema.json
          python3 -m bts validate examples/valid/manifest-nano.json
          python3 -m bts spec-hash
          python3 -m bts evaluate examples/valid/manifest-nano.json 200 examples/evidence/report-pass.json
          ./bin/bts validate examples/valid/manifest-nano.json
      - name: an invalid task exits 1 and an unreadable one exits 2
        # The three exit codes are the CLI's whole contract with a calling agent,
        # and the happy path above only ever shows one of them. The default shell
        # is `bash -e`, so each non-zero exit is captured in a `||` list - a bare
        # `cmd; test $? -eq 1` would abort the step on the very exit it checks.
        run: |
          set -u
          python3 -m bts validate examples/invalid/unknown-field.json && rc=0 || rc=$?
          test "$rc" -eq 1
          python3 -m bts validate /nonexistent/task.json && rc=0 || rc=$?
          test "$rc" -eq 2
